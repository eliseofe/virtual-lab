name: CI and Pages deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'
  pull_request:
    # No paths-ignore: every pull request must report the required `build`
    # check, including documentation-only ones, or it could never be merged.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: virtual-lab-ci-pages-v3-${{ github.ref }}
  # A release on main is never cancelled halfway; a newer push waits for it.
  # Pull-request checks still cancel superseded runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Rust with WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Test browser/compiler contracts
        env:
          VLAB_REQUIRE_DOCKER: '1'
        run: node --test web/tests/*.test.mjs

      - name: Typecheck frontend
        working-directory: web
        run: npm run typecheck

      - name: Build Rust kernel for browser
        working-directory: crates/kernel
        run: wasm-pack build --release --target web --out-dir ../../web/public/wasm --out-name vlab_kernel

      - name: Replay behaviour references on the browser kernel
        run: node web/scripts/reference-runs-wasm.mjs

      - name: Build static browser artifact
        working-directory: web
        run: npm run build

      - name: Stamp exact candidate
        if: github.event_name != 'pull_request'
        run: printf '%s\n' "$GITHUB_SHA" > web/dist/deploy-sha.txt

      - name: Verify browser artifact
        run: node web/scripts/verify-dist.mjs

      - name: Verify exact build in a browser before publishing
        run: node web/scripts/pre-publish-smoke.mjs

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout active-product smoke tracker
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Wait for exact deployed candidate
        run: node web/scripts/wait-deployed-sha.mjs "https://eliseofe.github.io/virtual-lab/" "$GITHUB_SHA"

      - name: Verify deployed current Lab surface
        run: node web/scripts/run-active-product-smoke.mjs "https://eliseofe.github.io/virtual-lab/"

      - name: Send owner success report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          parent_sha="$(git rev-parse "${GITHUB_SHA}^1")"
          if ! git diff --name-only "$parent_sha" "$GITHUB_SHA" -- .github/terminal-report.json | grep -qx '.github/terminal-report.json'; then
            echo "::error::.github/terminal-report.json was not updated by this deployed candidate."
            exit 1
          fi

          if ! jq -e '
            .schema == "vlab.terminal-report/2"
            and (.outcome | type == "string") and (.outcome | length > 0)
            and (.owner_impact | type == "string") and (.owner_impact | length > 0)
            and (.next | type == "object")
            and (.next.text | type == "string") and (.next.text | length > 0)
            and (
              (
                .next.kind == "epic_continues"
                and (.next.issue | type == "number") and (.next.issue > 0)
              )
              or
              (
                .next.kind == "scope_complete"
                and ((.next.disposition == "closed") or (.next.disposition == "dormant"))
                and (.next.lab_url == "https://eliseofe.github.io/virtual-lab/")
              )
            )
            and ((.technical_evidence // []) | type == "array")
          ' .github/terminal-report.json >/dev/null; then
            echo "::error::.github/terminal-report.json must use vlab.terminal-report/2 and exactly one supported Next state."
            exit 1
          fi

          outcome="$(jq -r '.outcome' .github/terminal-report.json)"
          owner_impact="$(jq -r '.owner_impact' .github/terminal-report.json)"
          remaining="$(jq -r '.next.text' .github/terminal-report.json)"
          technical="$(printf '%s\n%s\n%s' \
            "- Commit: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" \
            "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "- Verification: build, Pages deployment, exact-candidate propagation, and deployed-surface smoke all passed.")"
          report_technical="$(jq -r '(.technical_evidence // []) | map("- " + .) | join("\n")' .github/terminal-report.json)"
          if [ -n "$report_technical" ]; then
            technical="$(printf '%s\n%s' "$technical" "$report_technical")"
          fi
          close_issue="$(jq -r '.close_issue // empty' .github/terminal-report.json)"

          body="$(printf '@eliseofe\n\n✅ **Virtual Lab production deployment succeeded**\n\n**%s**\n\n**What changed for you**\n%s\n\n**Next**\n%s\n\n**Technical evidence**\n%s' "$outcome" "$owner_impact" "$remaining" "$technical")"
          payload="$(jq -n --arg body "$body" '{body:$body}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            --data "$payload" >/dev/null

          if [[ "$close_issue" =~ ^[0-9]+$ ]] && [ "$close_issue" -gt 0 ]; then
            curl --fail-with-body --silent --show-error \
              --request PATCH \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${close_issue}" \
              --data '{"state":"closed","state_reason":"completed"}' >/dev/null
          fi
