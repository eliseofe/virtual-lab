name: CI and Pages deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: virtual-lab-ci-pages-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Rust with WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Test browser/compiler contracts
        run: node --test web/tests/*.test.mjs

      - name: Typecheck frontend
        working-directory: web
        run: npm run typecheck

      - name: Build Rust kernel for browser
        working-directory: crates/kernel
        run: wasm-pack build --release --target web --out-dir ../../web/public/wasm --out-name vlab_kernel

      - name: Build static browser artifact
        working-directory: web
        run: npm run build

      - name: Stamp exact candidate
        if: github.event_name != 'pull_request'
        run: printf '%s\n' "$GITHUB_SHA" > web/dist/deploy-sha.txt

      - name: Verify browser artifact
        run: node web/scripts/verify-dist.mjs

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout active-product smoke tracker
        uses: actions/checkout@v6

      - name: Wait for exact deployed candidate
        run: node web/scripts/wait-deployed-sha.mjs "https://eliseofe.github.io/virtual-lab/" "$GITHUB_SHA"

      - name: Verify deployed current Lab surface
        run: node web/scripts/run-active-product-smoke.mjs "https://eliseofe.github.io/virtual-lab/"

      - name: Send owner success report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_ISSUE: '145'
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          changed="$(jq -r '(((.head_commit.added // []) + (.head_commit.modified // []) + (.head_commit.removed // [])) | index(".github/terminal-report.json")) != null' "$GITHUB_EVENT_PATH")"

          commit_message="$(jq -r '.head_commit.message // empty' "$GITHUB_EVENT_PATH")"
          first_line="$(printf '%s\n' "$commit_message" | sed -n '1p')"
          if [[ "$first_line" == "Merge pull request #"* ]]; then
            change_summary="$(printf '%s\n' "$commit_message" | awk 'seen_blank && NF { print; exit } !NF { seen_blank=1 }')"
          else
            change_summary="$first_line"
          fi
          if [ -z "$change_summary" ]; then
            change_summary="Production change ${short_sha}"
          fi

          outcome="$change_summary"
          owner_impact="Now live in production: ${change_summary}"
          remaining="Nothing. This change is complete."
          technical="$(printf '%s\n%s\n%s' \
            "- Commit: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" \
            "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "- Verification: build, Pages deployment, exact-candidate propagation, and deployed-surface smoke all passed.")"
          close_issue=""

          if [ "$changed" = "true" ] && jq -e '.schema == "vlab.terminal-report/1" and (.outcome | type == "string") and (.owner_impact | type == "string") and (.remaining_action | type == "string")' .github/terminal-report.json >/dev/null 2>&1; then
            outcome="$(jq -r '.outcome' .github/terminal-report.json)"
            owner_impact="$(jq -r '.owner_impact' .github/terminal-report.json)"
            remaining="$(jq -r '.remaining_action' .github/terminal-report.json)"
            report_technical="$(jq -r '(.technical_evidence // []) | map("- " + .) | join("\n")' .github/terminal-report.json)"
            if [ -n "$report_technical" ]; then
              technical="$(printf '%s\n%s' "$technical" "$report_technical")"
            fi
            close_issue="$(jq -r '.close_issue // empty' .github/terminal-report.json)"
          fi

          body="$(printf '@eliseofe\n\n✅ **Virtual Lab production deployment succeeded**\n\n**%s**\n\n**What changed for you**\n%s\n\n**Next**\n%s\n\n**Technical evidence**\n%s' "$outcome" "$owner_impact" "$remaining" "$technical")"
          payload="$(jq -n --arg body "$body" '{body:$body}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${REPORT_ISSUE}/comments" \
            --data "$payload" >/dev/null

          if [[ "$close_issue" =~ ^[0-9]+$ ]] && [ "$close_issue" -gt 0 ]; then
            curl --fail-with-body --silent --show-error \
              --request PATCH \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${close_issue}" \
              --data '{"state":"closed","state_reason":"completed"}' >/dev/null
          fi
