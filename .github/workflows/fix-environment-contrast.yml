name: One-shot environment contrast fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply environment contrast fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/src/main.js')
          s = p.read_text()
          old = 'const shade = Math.round(245 - normalized * 90);'
          new = 'const shade = Math.round(255 * (1 - normalized));'
          if old not in s:
              raise SystemExit('expected grayscale mapping not found')
          s = s.replace(old, new, 1)
          old = 'context.globalAlpha = 0.72;'
          new = 'context.globalAlpha = 1.0;'
          if old not in s:
              raise SystemExit('expected environment alpha not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Test
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/src/main.js
          git commit -m "Fix scalar-field visualization contrast"
          git push
