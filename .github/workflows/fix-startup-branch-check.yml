name: Startup and initializer branch check

on:
  push:
    branches: [fix-startup-and-initializers]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Test Rust kernel
        run: cargo test --workspace
      - name: Test browser source
        run: node --test web/tests/*.test.mjs
      - name: Build WASM
        working-directory: crates/kernel
        run: wasm-pack build --release --target web --out-dir ../../web/public/wasm --out-name vlab_kernel
      - name: Build static artifact
        run: node web/scripts/build.mjs
      - name: Verify static artifact
        run: node web/scripts/verify-dist.mjs
      - name: Smoke-test browser startup locally
        run: |
          cd web/dist
          python3 -m http.server 4173 >/tmp/vlab-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cd ../..
          node web/scripts/browser-smoke.mjs http://127.0.0.1:4173/
