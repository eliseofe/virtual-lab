name: One-shot issue 153 closeout

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue153-closeout.yml"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Update durable project state
        run: |
          python - <<'PY'
          from pathlib import Path

          control = Path('PROJECT_CONTROL.md')
          text = control.read_text()
          old = '''### Next substantial UI child

The next #147 implementation checkpoint is **workspace continuity + unified experiment switching** from #148:

- signed-in refresh/reopen should restore the last accessible working Experiment instead of falling back to Showcase/built-in;
- one searchable switcher should cover Recent / My experiments / Showcase without requiring source or collection preselection;
- collections remain secondary organization, not a prerequisite for finding/running an Experiment.

Do **not** start this next child inside the #150 completion unit. Create/execute it as a separate substantial ticket under `docs/EXECUTION_GRANULARITY.md`.
'''
          new = '''The second substantial implementation child is also complete and deployed:

- **#153 / PR #154 — workspace continuity + unified Experiment switching**;
- merge `dfb70a3882176cd28a11fb3f891952eccc28d865`;
- production workflow `34895522534`: build, GitHub Pages deploy and deployed-browser smoke all **success** after one external GitHub OIDC-token timeout was retried unchanged;
- authenticated workspace state remembers the last accessible owned Experiment and restores it after refresh;
- Built-in and owned runnable Experiments share one direct switcher and one searchable finder;
- collections are optional metadata/filters rather than a prerequisite for finding or opening an Experiment;
- dirty-edit discard protection and existing save/revision/conflict/move semantics remain intact;
- no Experiment content, scientific/controller semantics, simulator, Supabase schema/data, MCP contract, capability request/lifecycle or Showcase policy changed.

### Next substantial UI child

The next #147 checkpoint is **editor/workspace organization** from #148: replace the long stack of always-open Configuration / Initialization / Controller surfaces with a coherent workbench/tab model while keeping the arena and runtime controls primary. Treat deeper collection-management cleanup and visual/responsive polish as later children rather than silently bundling them.

Do **not** start that next child inside the #153 completion unit. Create/execute it as a separate substantial ticket under `docs/EXECUTION_GRANULARITY.md`.
'''
          if old not in text:
              raise SystemExit('PROJECT_CONTROL #153 frontier block not found')
          control.write_text(text.replace(old, new, 1))

          state = Path('PROJECT_STATE.md')
          text = state.read_text()
          old = '- #143 generic scalar Environment / local scalar observation: `7b4861e90dc00633f811cd5d882617b74301c765`\n'
          new = old + '- #150 simulation-first workspace shell (final fix): `9f75ed7f9e2530e8c5681a30f3126b2f4b2a2bdd`\n- #153 workspace continuity + unified Experiment switcher: `dfb70a3882176cd28a11fb3f891952eccc28d865`\n'
          if old not in text:
              raise SystemExit('PROJECT_STATE recent merge anchor not found')
          text = text.replace(old, new, 1)
          old = 'The current owner-visible blocker is the Lab UI/UX. Epic #147 is now the active redesign frontier; #148 contains the completed audit/proposed simulation-first interaction architecture. Further owner feature testing is paused until the redesign materially improves the primary workflow. #115/#118 owner acceptance is therefore still deferred behind #147.\n'
          new = '''The current owner-visible blocker remains the Lab UI/UX. Epic #147 is the active redesign frontier and #148 is the completed interaction audit. Two substantial redesign children are now deployed: #150 made the workspace simulation-first, and #153 added workspace continuity plus one unified Experiment switcher/finder. Production verification for #153 is workflow `34895522534` (build/deploy/deployed-browser smoke success); its initial deploy attempt hit an external GitHub OIDC-token timeout and succeeded on an unchanged retry. #115/#118 owner acceptance remains deferred behind the redesign. The next substantial UI child is editor/workspace organization; deeper collection-management cleanup and visual/responsive polish remain later children.\n'''
          if old not in text:
              raise SystemExit('PROJECT_STATE UI frontier paragraph not found')
          state.write_text(text.replace(old, new, 1))
          PY
      - name: Commit durable closeout and remove one-shot workflow
        run: |
          git rm .github/workflows/issue153-closeout.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PROJECT_CONTROL.md PROJECT_STATE.md
          git commit -m "docs: close out UI workspace continuity checkpoint (#153)"
          git push origin HEAD:main
