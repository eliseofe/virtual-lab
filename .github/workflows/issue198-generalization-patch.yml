name: Issue 198 two-metric patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'issue-198-two-metric-generalization'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply deterministic source patch
        run: python tools/issue198_apply_two_metric_generalization.py
      - name: Commit patch if needed
        run: |
          # The GitHub App may not update workflow files. The existing deployed
          # smoke step already invokes this same script, so keep its label unchanged.
          git checkout -- .github/workflows/round1a-pages.yml
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply #198 two-metric generalization [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
