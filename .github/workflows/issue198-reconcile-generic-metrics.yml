name: Issue 198 reconcile generic Metrics

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'issue-198-two-metric-generalization'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Reconcile generic Metrics architecture
        run: python tools/issue198_reconcile_generic_metrics.py
      - name: Commit reconciliation
        run: |
          if git diff --quiet; then
            echo "Already reconciled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/experiment-artifacts.js web/tests/issue198-builtin-metric.test.mjs web/tests/issue198-results-owner-ux.test.mjs
          git commit -m "Reconcile #198 with generic Metrics artifact architecture [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
