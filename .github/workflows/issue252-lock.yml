name: Issue 252 dependency lock

on:
  push:
    branches: [issue-252-vite-react-mantine-foundation]
    paths:
      - 'web/package.json'
      - '.github/workflows/issue252-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-252-vite-react-mantine-foundation
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json
      - name: Generate npm lockfile
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if git diff --quiet -- web/package-lock.json && git ls-files --error-unmatch web/package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/package-lock.json
          git commit -m 'Pin #252 frontend dependencies'
          git push
