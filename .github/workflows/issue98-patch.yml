name: Apply issue 98 patch

on:
  push:
    branches: [perf/issue-98-bearing-rotation]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/issue-98-bearing-rotation
      - name: Apply focused patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/kernel/src/lib.rs')
          text = path.read_text()
          old = '''        out.heading = state[agent_index].heading();
                  out.neighbours.clear();
                  for &index in neighbour_indices.iter() {
                      let relative = minimum_image(state[index].position - origin, arena_size).rotate(bearing_noise);
                      out.neighbours.push(NeighbourObservation { relative_position: relative });
                  }
          '''
          new = '''        out.heading = state[agent_index].heading();
                  out.neighbours.clear();
                  if neighbour_indices.is_empty() { return; }
                  let (sin, cos) = bearing_noise.sin_cos();
                  for &index in neighbour_indices.iter() {
                      let relative = minimum_image(state[index].position - origin, arena_size);
                      let relative = Vec2::new(
                          cos * relative.x - sin * relative.y,
                          sin * relative.x + cos * relative.y,
                      );
                      out.neighbours.push(NeighbourObservation { relative_position: relative });
                  }
          '''
          if old not in text:
              raise SystemExit('expected observe_into block not found')
          text = text.replace(old, new, 1)
          marker = '''    #[test]
              fn reusable_observation_path_matches_owned_observation() {
          '''
          test = '''    #[test]
              fn precomputed_bearing_rotation_matches_vec2_rotate_exactly() {
                  let vectors = [
                      Vec2::new(0.0, 0.0),
                      Vec2::new(1.25, -0.75),
                      Vec2::new(-4.9, 3.2),
                  ];
                  for angle in [0.0, 0.17, -0.23, std::f64::consts::PI, -2.7] {
                      let (sin, cos) = angle.sin_cos();
                      for vector in vectors {
                          let expected = vector.rotate(angle);
                          let actual = Vec2::new(
                              cos * vector.x - sin * vector.y,
                              sin * vector.x + cos * vector.y,
                          );
                          assert_eq!(actual, expected);
                      }
                  }
              }

          '''
          if marker not in text:
              raise SystemExit('test insertion marker not found')
          text = text.replace(marker, test + marker, 1)
          path.write_text(text)
          PY
          git rm .github/workflows/issue98-patch.yml
          git config user.name "Eliseo Ferrante"
          git config user.email "eliseofe@gmail.com"
          git add crates/kernel/src/lib.rs
          git commit -m "#98 reuse bearing rotation per observation"
          git push origin HEAD:perf/issue-98-bearing-rotation
