name: MCP deploy

# #575: keep the Experiment MCP (the AI authoring server) on the same code as the
# Lab. Any change to its source on main redeploys it pinned to that commit,
# then checks that the live server reports the commit. The compilers it uses
# are byte-identical copies of the Lab's (checked below), so a compiler change
# reaches the MCP through the same path.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/experiment-mcp/**'
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Only report whether the live MCP runs the repository''s MCP code (no deployment, no credentials needed)'
        type: boolean
        default: false

concurrency:
  group: mcp-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: izdmmudfrmqhvlgepwes
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Report whether the live MCP matches the repository
        if: inputs.check_only
        run: node web/scripts/mcp-deploy.mjs status

      - name: Check the MCP carries the Lab's compilers
        if: ${{ !inputs.check_only }}
        run: node web/scripts/sync-edge-vendor.mjs --check

      - name: Require deployment credentials
        if: ${{ !inputs.check_only }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is not set, so the MCP was NOT updated to ${GITHUB_SHA}. Add the secret (see docs/EXPERIMENT_MCP.md, Deployment) and re-run this workflow."
            exit 1
          fi

      - name: Set up Supabase CLI
        if: ${{ !inputs.check_only }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Write deployment stub pinned to this commit
        if: ${{ !inputs.check_only }}
        run: node web/scripts/mcp-deploy.mjs stub "$GITHUB_SHA" "$RUNNER_TEMP/mcp"

      - name: Deploy
        if: ${{ !inputs.check_only }}
        run: supabase functions deploy experiment-mcp --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api --workdir "$RUNNER_TEMP/mcp"

      - name: Verify the live MCP runs this commit
        if: ${{ !inputs.check_only }}
        run: node web/scripts/mcp-deploy.mjs verify "$GITHUB_SHA"
