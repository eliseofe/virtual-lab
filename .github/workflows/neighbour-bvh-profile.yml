name: Adaptive BVH neighbour benchmark

on:
  pull_request:
    paths:
      - 'crates/kernel/examples/adaptive_periodic_bvh.rs'
      - 'crates/kernel/examples/neighbour_adaptive_bvh_benchmark.rs'
      - 'crates/kernel/examples/multi_resolution_periodic_grid.rs'
      - 'benchmarks/neighbour_search_matrix.json'
      - '.github/workflows/neighbour-bvh-profile.yml'
  push:
    branches: [main]
    paths:
      - 'crates/kernel/examples/adaptive_periodic_bvh.rs'
      - 'crates/kernel/examples/neighbour_adaptive_bvh_benchmark.rs'
      - 'crates/kernel/examples/multi_resolution_periodic_grid.rs'
      - 'benchmarks/neighbour_search_matrix.json'
      - '.github/workflows/neighbour-bvh-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Run exact adaptive BVH benchmark
        shell: bash
        run: |
          set -o pipefail
          cargo run --release -p vlab-kernel --example neighbour_adaptive_bvh_benchmark | tee neighbour-adaptive-bvh-profile.txt
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: neighbour-adaptive-bvh-${{ github.sha }}
          path: neighbour-adaptive-bvh-profile.txt
          retention-days: 30
