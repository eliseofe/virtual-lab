name: Faithful RAB strategy comparison

on:
  pull_request:
    paths:
      - 'crates/kernel/**'
      - 'benchmarks/neighbour_search_matrix.json'
      - '.github/workflows/neighbour-rab-comparison.yml'
      - 'docs/NEIGHBOUR_SEARCH_*'
  push:
    branches: [main]
    paths:
      - 'crates/kernel/**'
      - 'benchmarks/neighbour_search_matrix.json'
      - '.github/workflows/neighbour-rab-comparison.yml'
      - 'docs/NEIGHBOUR_SEARCH_*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Record runner environment
        run: |
          {
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            uname -a
            rustc --version --verbose
            cargo --version
            lscpu
          } > rab-strategy-comparison-environment.txt
      - name: Run faithful RAB strategy comparison
        run: |
          set -o pipefail
          cargo run --release -p vlab-kernel --example rab_strategy_comparison | tee rab-strategy-comparison.txt
      - name: Upload comparison evidence
        uses: actions/upload-artifact@v4
        with:
          name: rab-strategy-comparison-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            rab-strategy-comparison.txt
            rab-strategy-comparison-environment.txt
          retention-days: 90
