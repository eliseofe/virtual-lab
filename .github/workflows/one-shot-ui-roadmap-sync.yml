name: One-shot UI roadmap sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update durable roadmap frontier
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('PROJECT_CONTROL.md')
          s = p.read_text()
          anchor = '## Current strategic objective\n'
          if anchor not in s:
              raise SystemExit('PROJECT_CONTROL strategic-objective anchor missing')
          new = '''## Current strategic objective — UI/UX redesign blocker\n\nThe first real Professor/Grok paper-driven capability loop is accepted as a **successful end-to-end round**. Generic static scalar Environment + `obs.environmental_scalar` are deployed, Grok resumed the Experiment, the owner iterated the paper-specific setup, and the resulting Experiment runs successfully. Showcase promotion is optional Professor curation and is **not** required for this loop to count as complete.\n\nThe immediate product blocker is now **#147 — Full Virtual Lab UI/UX audit and interaction redesign**. #148 completed the audit/proposed interaction architecture. Further owner feature testing is intentionally paused until the Lab has a materially improved simulation-first workspace. The next implementation work must be split into substantial independently deployable children of #147 under `docs/EXECUTION_GRANULARITY.md`; do not execute the whole epic as one ticket.\n\n#115/#118 owner acceptance and optional first-paper refinement/Showcase decision (#149) remain deferred behind the redesign unless the owner explicitly reprioritizes them.\n\n## Previous strategic objective — Professor paper loop\n'''
          s = s.replace(anchor, new, 1)
          marker = '## Current one-line status\n\n'
          if marker not in s:
              raise SystemExit('PROJECT_CONTROL one-line marker missing')
          before, after = s.split(marker, 1)
          old_line_end = after.find('\n')
          if old_line_end == -1:
              old_line_end = len(after)
          after = '**The first real Professor/Grok paper loop is a win. UI/UX is now the blocking frontier: #147 is the redesign epic and #148 contains the completed simulation-first interaction audit. Next: review/accept that architecture, then execute one substantial #147 child at a time. Showcase promotion is optional Professor curation; #149 is parked behind the redesign.**' + after[old_line_end:]
          p.write_text(before + marker + after)

          p = Path('PROJECT_STATE.md')
          s = p.read_text()
          old = '''The first real Professor/Grok capability-request loop is now being tested end-to-end with the Karagüzel et al. 2023 collective-gradient-perception paper. Request creation, Professor note/approval, developer discussion/handoff, generic capability implementation, deployment and `implemented` provenance have all occurred. The immediate live acceptance step is now back in Grok: it should re-read the live contract and complete the preserved experiment using the paper's actual scalar field and controller modulation.\n\nA broader Lab UI/UX audit is parked until the functional loop has settled. The owner prefers the assistant to identify coherent visual/usability improvements rather than requiring point-by-point feedback.'''
          new = '''The first real Professor/Grok capability-request loop on the Karagüzel et al. 2023 collective-gradient-perception paper is now accepted by the owner as a **successful end-to-end round**. Request creation, Professor note/approval, developer discussion/handoff, generic capability implementation/deployment, Grok continuation and live Experiment testing have all occurred. A renderer-only scalar-field contrast correction was also deployed and accepted; scientific values/sensing/controller semantics were unchanged.\n\nShowcase promotion is a separate optional Professor/curator decision, not a success condition for paper-driven Experiment authoring. The working Experiment may be refined/promoted later or remain private.\n\nThe current owner-visible blocker is the Lab UI/UX. Epic #147 is now the active redesign frontier; #148 contains the completed audit/proposed simulation-first interaction architecture. Further owner feature testing is paused until the redesign materially improves the primary workflow. #115/#118 owner acceptance is therefore still deferred behind #147.'''
          if old not in s:
              raise SystemExit('PROJECT_STATE old owner-visible block missing')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit roadmap sync
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PROJECT_CONTROL.md PROJECT_STATE.md
          git commit -m "Promote UI UX redesign to current frontier"
          git push
