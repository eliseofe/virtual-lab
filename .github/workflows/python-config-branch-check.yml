name: Python config + initializer branch check

on:
  push:
    branches: [round1-python-config-initializer]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Test Rust kernel
        run: cargo test --workspace
      - name: Test browser code
        run: node --test web/tests/*.test.mjs
      - name: Build Rust kernel for browser
        working-directory: crates/kernel
        run: wasm-pack build --release --target web --out-dir ../../web/public/wasm --out-name vlab_kernel
      - name: Build static browser artifact
        run: node web/scripts/build.mjs
      - name: Verify static artifact
        run: |
          test -f web/dist/index.html
          test -f web/dist/worker.js
          test -f web/dist/config/compiler.js
          test -f web/dist/initializer/compiler.js
          test -f web/dist/wasm/vlab_kernel_bg.wasm
