name: Round 1A build and Pages probe

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: virtual-lab-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust with WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Test Rust scientific-kernel probe
        run: cargo test --workspace

      - name: Test python-vlab compiler probe
        run: node --test web/tests/*.test.mjs

      - name: Build Rust kernel for browser
        working-directory: crates/kernel
        run: wasm-pack build --release --target web --out-dir ../../web/public/wasm --out-name vlab_kernel

      - name: Build static browser artifact
        run: node web/scripts/build.mjs

      - name: Verify coherent browser artifact
        run: node web/scripts/verify-dist.mjs

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout browser smoke script
        uses: actions/checkout@v6
      - name: Verify deployed browser reaches kernel ready with populated editors
        run: |
          URL="https://eliseofe.github.io/virtual-lab/"
          for attempt in 1 2 3 4 5 6; do
            if node web/scripts/browser-smoke.mjs "$URL"; then
              exit 0
            fi
            echo "Deployed browser check attempt $attempt failed; retrying after propagation delay."
            sleep 5
          done
          exit 1
