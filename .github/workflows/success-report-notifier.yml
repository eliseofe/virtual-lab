name: Success report notifier

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  notify:
    if: >-
      github.event.issue.number == 145 &&
      startsWith(github.event.comment.body, '[SUCCESS REPORT]') &&
      github.event.comment.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Send GitHub success notification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          report="$(jq -r '.comment.body' "$GITHUB_EVENT_PATH")"
          report="${report#\[SUCCESS REPORT\]}"
          body="$(printf '@eliseofe\n\n%s' "$report")"
          payload="$(jq -n --arg body "$body" '{body:$body}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --data "$payload" >/dev/null
