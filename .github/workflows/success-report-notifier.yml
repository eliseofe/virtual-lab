name: Success report notifier

on:
  issues:
    types: [edited]

permissions:
  contents: read
  issues: write

jobs:
  notify:
    if: github.event.issue.number == 145
    runs-on: ubuntu-latest
    steps:
      - name: Send explicit terminal-success notification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_COUNT: ${{ github.event.issue.comments }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${COMMENT_COUNT}" -lt 1 ]; then
            echo "No success-report comment exists."
            exit 1
          fi
          page=$(( (COMMENT_COUNT - 1) / 100 + 1 ))
          comments="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100&page=${page}")"
          report="$(printf '%s' "$comments" | jq -r '.[-1].body // empty')"
          case "$report" in
            '[SUCCESS REPORT]'*) ;;
            *) echo "Latest comment is not a success report; refusing to notify."; exit 1 ;;
          esac
          report="${report#\[SUCCESS REPORT\]}"
          body="$(printf '@eliseofe\n\n%s' "$report")"
          payload="$(jq -n --arg body "$body" '{body:$body}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --data "$payload" >/dev/null
