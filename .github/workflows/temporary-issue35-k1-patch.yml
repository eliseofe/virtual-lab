name: Temporary issue 35 K1 patch

on:
  push:
    branches:
      - fix/issue-35-k1-units

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-35-k1-units
      - name: Apply approved K1 unit correction
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('web/src/main.js')
          text = path.read_text()
          old = 'K1 = 0.5\nK2 = 0.06'
          new = 'K1 = 0.005\nK2 = 0.06'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one default K1 occurrence, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/temporary-issue35-k1-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/main.js .github/workflows/temporary-issue35-k1-patch.yml
          git commit -m "Correct Active Elastic K1 default units for #35"
          git push origin HEAD:fix/issue-35-k1-units
